{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="card">
    <h2>Welcome, {{ user['username'] }}</h2>
    <p class="balance">Current Balance: <strong>Rs. {{ "%.2f"|format(user['balance']) }}</strong></p>
    <div class="actions">
        <a class="btn" href="{{ url_for('transfer') }}">Send Money</a>
        <a class="btn" href="{{ url_for('history') }}">View Transactions</a>
    </div>
</div>
{% endblock %}
